# Quality checks only: no deployment, no secrets, no production data.
# Runs typecheck, lint, all backend/frontend tests and build against a throwaway PostgreSQL
# service container that exists only for the duration of the job.
name: CI

on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'setup/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fleetora_ci
          # Disposable container reachable only from this job's runner: no password is stored anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fleetora_ci_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Same safety rules as on a developer PC: local host, *_dev / *_test names, separate databases.
      # The test guard is NOT relaxed for CI (no FLEETORA_ALLOW_NON_LOCAL_TEST_DB).
      DATABASE_URL: postgres://fleetora_ci@localhost:5432/fleetora_ci_dev
      TEST_DATABASE_URL: postgres://fleetora_ci@localhost:5432/fleetora_ci_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Development/build tools never ship in the runtime image (npm prune --omit=dev), so their advisories
      # are reported here as a visible warning instead of blocking (issue #16, DEPENDENCY_SECURITY_AUDIT_20261117).
      - name: Report development-only advisories (does not block)
        run: |
          npm audit --include=dev --json > audit-dev.json || true
          node -e "const v=require('./audit-dev.json').metadata.vulnerabilities; console.log('development audit:', JSON.stringify(v)); if (v.total) console.log('::warning title=Development-only npm advisories::' + JSON.stringify(v) + ' (see docs/DEPENDENCY_SECURITY_AUDIT_20261117.md)')"

      - name: Create the empty test database
        run: createdb -h localhost -U fleetora_ci fleetora_ci_test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (backend + frontend)
        run: npm test

      - name: Local OCR parser safety (no real documents, no external network)
        run: python3 -m unittest discover -s server/tools -p 'test_*.py'

      - name: Migrations apply cleanly and are idempotent (dev database)
        run: |
          npm run migrate
          npm run migrate | tee migrate-second-run.log
          grep -q "Database is up to date" migrate-second-run.log

      - name: Build
        run: npm run build
