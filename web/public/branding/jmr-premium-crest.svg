<path d="M380 275 492 189c20-14 47-22 88-22h86c46 0 75 20 128 78L380 281Z" fill="#060b12" opacity=".89" stroke="url(#silver)" stroke-width="6"/>
<path d="M590 172 569 266M787 245H382" stroke="#cbd5e0" opacity=".8" stroke-width="4"/>
<path d="M487 190 583 181 563 263H392Z" fill="#aeb9c7" opacity=".25"/>
<path d="M102 363 370 319 796 287 925 314" stroke="#f6faff" stroke-width="4" fill="none" opacity=".9"/>
