<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title">
<title id="title">Emblème chrome JMR LUXE CAR, voiture et bouclier</title>
<defs>
<linearGradient id="silver" x1=".08" y1="0" x2=".94" y2="1">
 <stop offset="0" stop-color="#6c7887"/><stop offset=".09" stop-color="#fff"/><stop offset=".18" stop-color="#b0b9c4"/>
 <stop offset=".3" stop-color="#f7faff"/><stop offset=".39" stop-color="#586574"/><stop offset=".47" stop-color="#faffff"/>
 <stop offset=".56" stop-color="#a5b0bc"/><stop offset=".68" stop-color="#eef5ff"/><stop offset=".76" stop-color="#687588"/>
 <stop offset=".89" stop-color="#fff"/><stop offset="1" stop-color="#798694"/>
</linearGradient>
<linearGradient id="brushed" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".15" stop-color="#d7dce3"/><stop offset=".32" stop-color="#424f5f"/><stop offset=".5" stop-color="#edf4fb"/><stop offset=".73" stop-color="#738091"/><stop offset=".91" stop-color="#fff"/><stop offset="1" stop-color="#7f8996"/></linearGradient>
<linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f9fbff"/><stop offset=".16" stop-color="#a9b7c7"/><stop offset=".23" stop-color="#293846"/><stop offset=".45" stop-color="#121d2b"/><stop offset=".6" stop-color="#5a6977"/><stop offset=".79" stop-color="#0b131e"/><stop offset="1" stop-color="#e5f0fb"/></linearGradient>
<linearGradient id="headlight" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7ffff"/><stop offset=".6" stop-color="#a4deff"/><stop offset="1" stop-color="#2485c2"/></linearGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>
<filter id="chromeShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#02050a" flood-opacity=".8"/></filter>
<radialGradient id="inside"><stop stop-color="#202b36" stop-opacity=".7"/><stop offset=".67" stop-color="#070c12" stop-opacity=".45"/><stop offset="1" stop-color="#03070b" stop-opacity=".95"/></radialGradient>
</defs>
