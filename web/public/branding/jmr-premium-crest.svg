<path d="M122 394h804" stroke="url(#brushed)" stroke-width="7" stroke-linecap="round" opacity=".9"/>
<!-- understated chrome highlight along the sill -->
<path d="M182 402h627" stroke="#fff" stroke-width="2" opacity=".65"/>
<!-- restrained three-dimensional specular highlights -->
<path d="M336 303Q463 296 586 270" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>
<ellipse cx="501" cy="710" rx="216" ry="7" fill="#e1eaf4" opacity=".19" filter="url(#soft)"/>
